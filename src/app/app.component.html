<p-toast></p-toast>

<p-menubar *ngIf="showMenubar" [model]="items">
    <ng-template #start>
        <img
            class="main-logo"
            [src]="theme.dark() ? 'assets/images/lu4-logo-white.png' : 'assets/images/lu4-logo.png'"
            alt="E·Global"
        />
    </ng-template>
    <ng-template #item let-item let-root="root">
        <ng-container *ngIf="item.routerLink; else plainMenuItem">
            <a
                pRipple
                class="flex items-center px-4 py-3 cursor-pointer gap-2"
                [routerLink]="item.routerLink"
                routerLinkActive="menu-link-active"
                [routerLinkActiveOptions]="{ exact: item.routerLink === '/' }"
            >
                <i [ngClass]="['ms-auto', item.icon]"></i>
                <span>{{ item.label }}</span>
                <p-badge *ngIf="item.badge" [ngClass]="{ 'ms-auto': !root }" [styleClass]="item.badgeStyleClass || 'new-badge'" [value]="item.badge" />
                <span *ngIf="item.shortcut"
                    class="ms-auto border border-surface rounded bg-emphasis text-muted-color text-xs p-1">{{ item.shortcut
                    }}</span>
                <i *ngIf="item.items" [ngClass]="['ms-auto pi', root ? 'pi-angle-down' : 'pi-angle-right']"></i>
            </a>
        </ng-container>

        <ng-template #plainMenuItem>
            <a pRipple class="flex items-center px-4 py-3 cursor-pointer gap-2" href="#">
                <i [ngClass]="['ms-auto', item.icon]"></i>
                <span>{{ item.label }}</span>
                <p-badge *ngIf="item.badge" [ngClass]="{ 'ms-auto': !root }" [styleClass]="item.badgeStyleClass || 'new-badge'" [value]="item.badge" />
                <span *ngIf="item.shortcut"
                    class="ms-auto border border-surface rounded bg-emphasis text-muted-color text-xs p-1">{{ item.shortcut
                    }}</span>
                <i *ngIf="item.items" [ngClass]="['ms-auto pi', root ? 'pi-angle-down' : 'pi-angle-right']"></i>
            </a>
        </ng-template>
    </ng-template>
    <ng-template #end>
        <div class="menu-end">
            <app-voice-settings></app-voice-settings>
            <button
                type="button"
                class="menu-end-btn"
                (click)="theme.toggle()"
                [attr.aria-label]="theme.dark() ? 'Светлая тема' : 'Тёмная тема'"
                [title]="theme.dark() ? 'Светлая тема' : 'Тёмная тема'"
            >
                <i class="pi" [ngClass]="theme.dark() ? 'pi-sun' : 'pi-moon'"></i>
            </button>
            <button
                type="button"
                class="menu-end-btn"
                (click)="logout()"
                aria-label="Logout"
                title="Logout"
            >
                <i class="pi pi-sign-out"></i>
            </button>
        </div>
    </ng-template>
</p-menubar>

<router-outlet></router-outlet>
